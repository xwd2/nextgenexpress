<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NextGen Express — Fleet Fuel Portal</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #090b0e;
      color: #f3f4f6;
      overflow: hidden;
      position: relative;
    }

    /* Ambient background glow */
    .glow {
      position: absolute;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, rgba(16, 185, 129, 0.05) 50%, transparent 70%);
      filter: blur(60px);
      z-index: 0;
      pointer-events: none;
    }

    /* Centered glass card */
    .card {
      position: relative;
      z-index: 1;
      width: 90%;
      max-width: 460px;
      padding: 40px 32px;
      background: rgba(17, 24, 39, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 0.8rem;
      font-weight: 500;
      color: #9ca3af;
      margin-bottom: 24px;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      background-color: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 10px;
    }

    p {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #9ca3af;
      margin-bottom: 32px;
    }

    /* Primary CTA Button */
    .launch-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 24px;
      background: #ffffff;
      color: #0b0f17;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      border-radius: 12px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 14px rgba(255, 255, 255, 0.1);
    }

    .launch-btn:hover {
      background: #f1f5f9;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(255, 255, 255, 0.18);
    }

    .launch-btn:active {
      transform: translateY(0);
    }

    .launch-btn svg {
      transition: transform 0.2s ease;
    }

    .launch-btn:hover svg {
      transform: translateX(3px);
    }

    .footer-note {
      margin-top: 24px;
      font-size: 0.8rem;
      color: #6b7280;
    }

    .footer-note a {
      color: #9ca3af;
      text-decoration: none;
      transition: color 0.15s;
    }

    .footer-note a:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="glow"></div>

  <main class="card">
    <div class="badge">
      <span class="badge-dot"></span>
      System Operational
    </div>

    <h1>NextGen Express</h1>
    <p>Access your fuel tax tracking, trip reporting, and fleet expense management system.</p>

    <a href="https://fuel.nextgenexp.com" class="launch-btn">
      Launch Fuel Portal
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </a>

    <div class="footer-note">
      Direct URL: <a href="https://fuel.nextgenexp.com">fuel.nextgenexp.com</a>
    </div>
  </main>

</body>
</html>
